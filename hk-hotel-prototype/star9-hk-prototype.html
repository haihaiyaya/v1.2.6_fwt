<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<title>星煥九號酒店 · 香港繁體版小程序原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --blue:#0E86F2; --blue-d:#0B76D8; --soft:#E8F3FF; --soft2:#F2F8FF;
  --ink:#0F1418; --ink2:#3D4550; --gray:#8B929D; --line:#EDEFF4;
  --bg:#F2F4F7; --red:#FF3B30; --orange:#F5A21B; --green:#18B26B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,"PingFang HK","PingFang SC","Microsoft JhengHei","Noto Sans HK","Helvetica Neue",sans-serif;
  background:#E7EAEF; color:var(--ink); -webkit-font-smoothing:antialiased;
}
/* ---------- shell ---------- */
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px;
  height:58px; padding:0 20px; background:#fff; border-bottom:1px solid #E3E7ED;
}
.topbar h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.2px;}
.topbar .sub{font-size:12px; color:var(--gray); margin-left:2px;}
.spacer{flex:1;}
.tbBtn{
  font-size:13px; padding:7px 14px; border-radius:999px; border:1px solid #DDE2EA;
  background:#fff; color:var(--ink2); cursor:pointer;
}
.tbBtn.on{background:var(--blue); border-color:var(--blue); color:#fff;}
.hintKey{font-size:12px; color:#9AA1AC;}
.stage{display:flex; justify-content:center; align-items:flex-start; gap:28px; padding:28px 20px 60px;}
.side{width:300px; font-size:12.5px; line-height:1.7; color:#4A515C;}
.side .panel{background:#fff; border-radius:14px; padding:16px 18px; box-shadow:0 1px 3px rgba(20,30,50,.06);}
.side h3{font-size:13px; margin:0 0 10px; color:#1B222B; letter-spacing:.3px;}
.side .tag{display:inline-block; background:var(--soft); color:var(--blue); border-radius:6px; padding:2px 7px; font-size:11px; margin:0 4px 6px 0;}
.side li{margin-bottom:7px; list-style:none;}
.side ul{margin:0; padding:0;}
.kv{display:flex; gap:8px; margin-bottom:6px;}
.kv b{font-weight:500; color:#7B838F; min-width:64px;}

/* ---------- device ---------- */
.dev{
  position:relative; width:390px; height:844px; background:#fff; border-radius:46px;
  box-shadow:0 24px 60px rgba(20,30,50,.22), 0 0 0 10px #12161C, 0 0 0 11px #2A3038;
  overflow:hidden; flex:0 0 auto;
}
.statusbar{
  position:absolute; left:0; right:0; top:0; height:44px; z-index:6;
  display:flex; align-items:center; padding:0 0 0 26px; font-size:15px; font-weight:600;
  letter-spacing:.3px; pointer-events:none;
}
.statusbar.onImg{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.35);}
.statusbar .sicons{margin-left:auto; margin-right:104px; display:flex; align-items:center; gap:6px;}
.capsule{
  position:absolute; top:47px; right:11px; width:88px; height:32px; z-index:9;
  background:rgba(255,255,255,.72); border:1px solid rgba(0,0,0,.06);
  border-radius:999px; display:flex; align-items:center; justify-content:space-around;
  backdrop-filter:blur(6px);
}
.capsule i{width:1px; height:16px; background:rgba(0,0,0,.1);}
.capsule .dots{display:flex; gap:3px;}
.capsule .dots b{width:4px; height:4px; background:#161B22; border-radius:50%; display:block;}
.capsule .tg{width:17px; height:17px; border:1.4px solid #161B22; border-radius:50%; position:relative;}
.capsule .tg::after{content:""; position:absolute; inset:4px; border:1.4px solid #161B22; border-radius:50%;}
.capsule.onImg{background:rgba(255,255,255,.5); border-color:rgba(255,255,255,.45);}
.capsule.onImg .dots b,.capsule.onImg .tg,.capsule.onImg .tg::after{background-color:#fff; border-color:#fff;}
.capsule.onImg .tg{background:none;}
.capsule.onImg .tg::after{background:none;}
.capsule.onImg i{background:rgba(255,255,255,.4);}

.navbar{
  position:absolute; left:0; right:0; top:44px; height:44px; z-index:5;
  display:flex; align-items:center; padding:0 104px 0 12px; background:#fff;
}
.navbar .back{width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.navbar .back svg{width:15px; height:15px; stroke:#111;}
.navbar .title{position:absolute; left:0; right:0; text-align:center; font-size:17px; font-weight:600; pointer-events:none;}
.navbar .title.onImg{color:#fff;}

.page{position:absolute; left:0; right:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
.page::-webkit-scrollbar{display:none;}
.page.bg{background:var(--bg);}

/* ---------- atoms ---------- */
.card{background:#fff; border-radius:16px; margin:12px; padding:18px 16px;}
.card.tight{padding:14px 16px;}
.card.flush{padding:0; overflow:hidden;}
h2.sec{font-size:16px; font-weight:600; margin:0 0 4px;}
h2.sm{font-size:15px; font-weight:600; margin:0 0 10px;}
.hint{font-size:12.5px; color:#9BA2AE; margin:2px 0 12px; line-height:1.5;}
.muted{color:var(--gray);}
.link{color:var(--blue); font-size:13px; text-decoration:none;}
.chev{width:8px; height:8px; border-right:1.4px solid #C6CCD6; border-top:1.4px solid #C6CCD6; transform:rotate(45deg); display:inline-block; margin-left:8px; margin-right:2px;}
.lrow{display:flex; align-items:center; justify-content:space-between; padding:17px 0; font-size:15px; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line);}
.lrow:last-child{border-bottom:none;}
.rowline{display:flex; align-items:center; justify-content:space-between; padding:13px 0; font-size:14px; border-bottom:1px solid var(--line);}
.rowline:last-child{border-bottom:none;}
.rowline span{color:#3D4550;}
.rowline b{font-weight:500; color:#1B222B;}
.seg{display:flex; gap:7px; padding:10px 12px 12px; background:var(--bg); overflow-x:auto; scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg a{flex:0 0 auto; padding:8px 14px; border-radius:8px; font-size:13px; color:#4A515C; background:#E9ECF1; text-decoration:none; cursor:pointer; white-space:nowrap;}
.seg a.on{background:var(--blue); color:#fff; font-weight:500;}
.seg.wide a{flex:1; text-align:center; font-size:13px; padding:9px 3px; min-width:0;}
.segctl{background:#F1F3F7; margin:12px; border-radius:999px; padding:4px; display:flex;}
.segctl a{flex:1; text-align:center; font-size:14px; color:#6E7681; padding:9px 0; border-radius:999px; text-decoration:none; cursor:pointer;}
.segctl a.on{background:#fff; color:#0F1418; font-weight:600; box-shadow:0 1px 3px rgba(20,30,50,.08);}
.btnbar{display:flex; gap:10px;}
.btn{flex:1; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:500; text-decoration:none;}
.btn.pri{background:var(--blue); color:#fff;}
.btn.ghost{border:1px solid #D7DDE6; color:var(--ink2); background:#fff;}
.pill{display:inline-flex; align-items:center; height:21px; padding:0 8px; border-radius:5px; font-size:12px; border:1px solid; }
.pill.blue{color:var(--blue); border-color:#B9DBFF; background:#F3F9FF;}
.pill.orange{color:#D98800; border-color:#F6D49A; background:#FFF8EA;}
.pill.gray{color:#7E8794; border-color:#DCE0E7; background:#F6F7F9;}
.pill.green{color:#0E9C5C; border-color:#B4E5CE; background:#F1FBF6;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; margin-right:8px; vertical-align:1px;}
.ph{color:#A9B0BB;}

/* tabbar */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; height:68px; z-index:7;
  background:#fff; border-top:1px solid #E9ECF1; display:flex; align-items:flex-start;
}
.tabbar .tb{flex:1; text-align:center; padding-top:8px; text-decoration:none; color:#9AA1AB; font-size:11px;}
.tabbar .tb.on{color:var(--blue);}
.tabbar .tb svg{width:23px; height:23px; display:block; margin:0 auto 2px; stroke-width:1.7;}
.tabbar .mid{position:relative; flex:0 0 96px;}
.tabbar .mid .ring{
  position:absolute; left:50%; transform:translateX(-50%); top:-16px;
  width:58px; height:58px; border-radius:50%; background:#fff;
  box-shadow:0 2px 10px rgba(20,40,80,.12); display:flex; align-items:center; justify-content:center;
}
.tabbar .mid .ring img{width:46px; height:46px; border-radius:50%; object-fit:cover;}
.tabbar .badge{
  position:absolute; right:14px; top:2px; min-width:17px; height:17px; padding:0 4px;
  background:var(--red); color:#fff; border-radius:9px; font-size:10px; line-height:17px; text-align:center;
}
.bbar{
  position:absolute; left:0; right:0; bottom:0; z-index:7; background:#fff;
  padding:10px 16px 24px; box-shadow:0 -1px 0 #EDEFF4;
}
.bbar .row{display:flex; align-items:center; gap:10px;}
.fab{
  position:absolute; right:12px; bottom:118px; z-index:8;
  background:linear-gradient(100deg,#0E86F2,#37A6FF); color:#fff; font-size:13px;
  padding:9px 16px 9px 12px; border-radius:999px; display:flex; align-items:center; gap:6px;
  box-shadow:0 6px 16px rgba(14,134,242,.35); text-decoration:none;
}
.fab svg{width:15px; height:15px; stroke:#fff;}

.hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(6,14,26,.55) 0%,rgba(6,14,26,.12) 42%,rgba(6,14,26,.55) 100%);}
.hcard{position:relative; margin:-52px 10px 0; z-index:2; padding:16px 14px 14px; box-shadow:0 6px 18px rgba(20,40,70,.10);}
.hcardRow{display:flex; gap:12px;}
.hinfo{flex:1; min-width:0;}
.hinfo h1{font-size:19px; margin:0 0 3px; letter-spacing:.5px;}
.hinfo .room{font-size:14.5px; color:#1B222B; margin-bottom:8px;}
.hinfo .desc{font-size:11.5px; color:#8B929D; line-height:1.55; margin:0;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.hthumb{width:92px; height:92px; border-radius:12px; object-fit:cover; flex:0 0 auto;}
.qgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px 2px; padding:14px 6px 10px;}
.qa{display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; color:#1B222B; font-size:12px;}
.qico{width:48px; height:48px; border-radius:13px; display:flex; align-items:center; justify-content:center;}
.qico svg{width:23px; height:23px;}
.qico i{font-style:normal;}
.svc{margin:10px 12px; padding:12px; border-radius:16px; background:linear-gradient(180deg,#E4F2FF,#EDF6FF);}
.svcTop{display:flex; align-items:center; gap:8px; font-size:13.5px; color:#24568A; margin-bottom:9px;}
.svcTop b{color:var(--blue);}
.svcBot{width:20px; height:20px; border-radius:50%; object-fit:cover;}
.svcTop .link{margin-left:auto; color:#24568A; opacity:.85;}
.svcItem{display:flex; align-items:center; background:#FBFCFF; border:1px solid #DCEBFB; border-radius:12px; padding:10px 12px 10px 14px; font-size:13.5px;}
.svcItem .txt{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.svcItem .ovd{color:var(--red); font-size:12.5px; margin-left:6px;}
.miniBtn{background:linear-gradient(100deg,#0E86F2,#39A5FF); color:#fff; font-size:13px; padding:6px 14px; border-radius:999px; text-decoration:none; flex:0 0 auto; margin-left:8px;}
.tabsCard{padding:4px 16px 4px;}
.tabs{display:flex; gap:0; padding:4px 0 0;}
.tabs span{flex:1; text-align:center; font-size:13.5px; color:#4A515C; padding:8px 0 9px; position:relative; cursor:pointer; white-space:nowrap;}
.tabs span.on{font-weight:600; color:#0F1418;}
.tabs span.on::after{content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:2px; width:22px; height:3px; border-radius:2px; background:var(--blue);}

/* forms */
.ta{border:1px solid #E5E8EE; border-radius:10px; padding:12px; min-height:150px; position:relative; font-size:13.5px; line-height:1.6; color:#333;}
.ta .count{position:absolute; right:12px; bottom:10px; color:#A9B0BB; font-size:12px;}
.ta.fill{color:#222;}
.field{border:1px solid #E5E8EE; border-radius:10px; padding:14px; display:flex; align-items:center; justify-content:space-between; font-size:15px;}
.opt{display:flex; align-items:center; gap:12px; border:1px solid #E5E8EE; border-radius:12px; padding:12px 14px; margin-bottom:10px;}
.opt.on{border-color:var(--blue); background:#F3F9FF;}
.oico{width:44px; height:44px; border-radius:50%; background:#E8F3FF; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.oico svg{width:20px; height:20px; stroke:var(--blue);}
.opt .tx b{display:block; font-size:15.5px; font-weight:600; margin-bottom:3px;}
.opt .tx span{font-size:12.5px; color:#8B929D;}
.upload{width:78px; height:78px; border:1px dashed #D5DAE3; border-radius:10px; display:flex; align-items:center; justify-content:center;}
.upload svg{width:26px; height:26px; stroke:#C3CAD5;}
.chips{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
.chips a{background:#F1F3F7; border-radius:8px; text-align:center; padding:11px 4px; font-size:13.5px; color:#2A3038; text-decoration:none;}
.chips a.on{background:var(--soft); color:var(--blue); box-shadow:inset 0 0 0 1px #B9DBFF;}

/* goods */
.searchbar{background:linear-gradient(180deg,#E4F2FF,#F1F8FF); padding:12px 12px 14px; display:flex; gap:10px; align-items:center;}
.sb{flex:1; height:38px; background:#fff; border-radius:999px; display:flex; align-items:center; gap:8px; padding:0 14px; font-size:13.5px; color:#A9B0BB;}
.sb svg{width:16px; height:16px; stroke:#A9B0BB;}
.sbtn{background:var(--blue); color:#fff; font-size:13.5px; padding:9px 18px; border-radius:999px; text-decoration:none;}
.goodsWrap{display:flex;}
.cat{width:96px; background:#F7F8FA; padding-top:8px;}
.cat span{display:block; padding:15px 8px; font-size:13.5px; color:#4A515C; text-align:center; position:relative;}
.cat span.on{background:#fff; color:var(--blue); font-weight:600;}
.cat span.on::before{content:""; position:absolute; left:0; top:16px; bottom:16px; width:3px; background:var(--blue); border-radius:0 2px 2px 0;}
.items{flex:1; background:#fff; padding:8px 12px 20px;}
.catTitle{font-size:14px; font-weight:600; margin:6px 0 12px;}
.item{display:flex; gap:10px; padding:8px 0 12px;}
.item img{width:76px; height:76px; border-radius:8px; object-fit:cover; flex:0 0 auto;}
.it{flex:1; display:flex; flex-direction:column; justify-content:space-between; padding:2px 0;}
.it b{font-size:15px; font-weight:500;}
.it .price{color:var(--red); font-size:14.5px;}
.stepper{display:flex; align-items:center; justify-content:flex-end; gap:14px; align-self:flex-end;}
.stepper i{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:16px;}
.stepper i.minus{border:1.4px solid var(--blue); color:var(--blue);}
.stepper i.plus{background:var(--blue); color:#fff;}
.stepper em{font-style:normal; font-size:15px;}
.stepper i.dis{background:#E4E7EC; color:#fff;}
.cartbar{display:flex; align-items:center; gap:12px;}
.cart{position:relative; width:44px; height:44px; border-radius:50%; background:#E8F3FF; display:flex; align-items:center; justify-content:center;}
.cart svg{width:22px; height:22px; stroke:var(--blue);}
.cart b{position:absolute; top:-2px; right:-2px; width:18px; height:18px; background:var(--red); color:#fff; border-radius:50%; font-size:10px; line-height:18px; text-align:center;}
.cartbar .tot{flex:1;}
.cartbar .tot .l1{font-size:14px;}
.cartbar .tot .l1 b{color:var(--red);}
.cartbar .tot .l2{font-size:11.5px; color:#8B929D;}
.cartbar .go{background:var(--blue); color:#fff; height:42px; padding:0 22px; border-radius:8px; display:flex; align-items:center; font-size:15px; text-decoration:none;}

/* orders */
.olist{padding:10px 12px 12px;}
.ocard{background:#fff; border-radius:14px; padding:14px; margin-bottom:10px;}
.ocard .top{display:flex; align-items:center; justify-content:space-between; font-size:13.5px; color:#2A3038;}
.ocard .top .st{font-size:13.5px;}
.st.blue{color:var(--blue);} .st.gray{color:#8B929D;} .st.orange{color:#E08A00;}
.ocard .mid{display:flex; align-items:flex-start; gap:12px; padding:12px 0 10px;}
.ocard .mid img{width:66px; height:66px; border-radius:8px; object-fit:cover;}
.ocard .amt{margin-left:auto; text-align:right;}
.ocard .amt span{display:block; font-size:11.5px; color:#8B929D;}
.ocard .amt b{font-size:18px; font-weight:600;}
.ocard .bot{display:flex; justify-content:space-between; font-size:12.5px; color:#7E8794; border-top:1px solid var(--line); padding-top:10px;}

/* status blocks */
.statCard{display:flex; gap:12px; align-items:flex-start;}
.statIco{width:52px; height:52px; border-radius:50%; border:2px solid var(--blue); display:flex; align-items:center; justify-content:center; gap:3px; flex:0 0 auto;}
.statIco b{width:5px; height:5px; border-radius:50%; background:var(--blue); display:block;}
.statTx{flex:1;}

const ORDER = ['home','clean','clean2','home-renew','home-wifi','goods','checkout','orders','order-detail','repair','feedback','guide','ai','me','receipt-title','receipt-list','receipt-detail','messages','review','service-detail'];
const TITLES = {home:'首頁',clean:'房間清潔',clean2:'房間清潔・預約',goods:'客房送物','home-renew':'首頁・續住確認','home-wifi':'首頁・Wi-Fi','checkout':'確認訂單',orders:'我的訂單','order-detail':'訂單詳情',repair:'設施報修',feedback:'意見反饋',guide:'服務指南',ai:'AI 助手',me:'我的','receipt-title':'收據・抬頭管理','receipt-list':'收據列表','receipt-detail':'收據詳情',messages:'訊息通知',review:'服務評價','service-detail':'服務詳情'};

function devHTML(id, mini){
  const s = S[id] || S.home;
  const top = s.top === undefined ? 88 : s.top;
  const barH = s.bar ? (s.barH || 82) : 0;
  const tabH = s.tab ? 68 : 0;
  const bot = barH + tabH + (s.extraBot || 0);
  return `<div class="dev" data-screen="${id}">
    ${statusbar(s.dark)}
    ${s.nav === false ? '' : navbar(s.title)}
    <div class="page ${s.bg ? 'bg' : ''}" style="top:${top}px;bottom:${bot}px;${s.bgcolor ? 'background:' + s.bgcolor + ';' : ''}">${s.body}</div>
    ${s.overlay || ''}
    ${s.bar ? `<div class="bbar" style="${s.barStyle || 'padding:10px 16px 24px'}">${s.bar}</div>` : ''}
    ${s.tab ? tabbar(s.tabActive || 'home') : ''}
    ${s.capsule === false ? '' : capsule(s.capsuleOnImg)}
  </div>`;
}

let cur = 'home', hist = [], gridMode = true, noteMode = false;

function render(){
  const stage = document.getElementById('stage');
  const gw = document.getElementById('gridWrap');
  if (gridMode){
    stage.style.display = 'none';
    gw.style.display = 'block';
    gw.innerHTML = '<div style="max-width:1500px;margin:0 auto;padding:6px 24px 60px;display:flex;flex-wrap:wrap;gap:26px 22px;justify-content:flex-start">' +
      ORDER.map(id => `<div style="width:125px"><div style="width:125px;height:270px;position:relative;overflow:hidden"><div style="position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(.32);transform-origin:top left">${devHTML(id, true)}</div></div>
        <div style="font-size:11px;color:#8B929D;margin-top:7px;text-align:center">${TITLES[id]}</div></div>`).join('') + '</div>';
    gw.querySelectorAll('.dev').forEach(d => d.addEventListener('click', () => openScreen(d.dataset.screen)));
    return;
  }
  gw.style.display = 'none';
  stage.style.display = 'flex';
  const left = noteMode ? `<div class="side"><div class="panel">
      <h3>本地化標註 · ${TITLES[cur] || ''}</h3>
      <ul>${(S[cur].notes || ['—']).map(n => `<li>${n}</li>`).join('')}</ul>
    </div></div>` : '';
  stage.innerHTML = `
    ${left}
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div id="devHolder">${devHTML(cur)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:390px">
        ${ORDER.map(id => `<a data-jump="${id}" style="font-size:11px;padding:5px 9px;border-radius:6px;text-decoration:none;border:1px solid ${id===cur?'#0E86F2':'#DDE2EA'};color:${id===cur?'#fff':'#6B7480'};background:${id===cur?'#0E86F2':'#fff'}">${TITLES[id]}</a>`).join('')}
      </div>
    </div>`;
  bind();
}

function bind(){
  document.querySelectorAll('[data-jump]').forEach(el => el.onclick = () => openScreen(el.dataset.jump));
  document.querySelectorAll('.dev a, .dev [data-go], .dev [data-toast]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const go = el.dataset.go, toast = el.dataset.toast;
      if (toast){ showToast(toast); return; }
      if (!go) return;
      if (go === '__back'){ back(); return; }
      openScreen(go);
    };
  });
}

function openScreen(id){
  if (gridMode){ gridMode = false; document.getElementById('btnGrid').classList.remove('on'); document.getElementById('btnGrid').textContent = '全部頁面'; }
  if (id !== cur) hist.push(cur);
  cur = id; render();
}

function back(){
  if (hist.length) cur = hist.pop();
  render();
}

let toastTimer;
function showToast(msg){
  let t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(24,30,38,.9);color:#fff;font-size:13px;padding:11px 18px;border-radius:8px;z-index:99;max-width:320px;text-align:center;line-height:1.5;transition:opacity .2s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = 0, 1800);
}

document.getElementById('btnGrid').onclick = function(){
  gridMode = !gridMode;
  this.classList.toggle('on', gridMode);
  this.textContent = gridMode ? '全部頁面' : '單頁瀏覽';
  render();
};
document.getElementById('btnNote').onclick = function(){
  noteMode = !noteMode;
  this.classList.toggle('on', noteMode);
  if (gridMode){ gridMode = false; document.getElementById('btnGrid').classList.remove('on'); document.getElementById('btnGrid').textContent = '全部頁面'; }
  render();
};
document.addEventListener('keydown', (e) => {
  if (gridMode) return;
  const i = ORDER.indexOf(cur);
  if (e.key === 'ArrowRight') openScreen(ORDER[Math.min(i + 1, ORDER.length - 1)]);
  if (e.key === 'ArrowLeft') openScreen(ORDER[Math.max(i - 1, 0)]);
});

/* 單屏截圖模式：?s=home */
const SHOT = new URLSearchParams(location.search).get('s');
(function(){
  if (!SHOT) return;
  document.querySelector('.topbar').style.display = 'none';
  document.body.style.background = '#fff';
  const st = document.getElementById('stage');
  st.style.padding = '0'; st.style.display = 'block';
  st.innerHTML = '<div style="width:390px;height:844px;overflow:hidden">' + devHTML(SHOT) + '</div>';
  const d = document.querySelector('.dev');
  d.style.boxShadow = 'none'; d.style.borderRadius = '0';
  const gw = document.getElementById('gridWrap'); if (gw) gw.remove();
})();

if (!SHOT) render();

</script>
